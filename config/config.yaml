# job-scraper configuration.
# Nothing in this file is secret - it's safe to commit and edit directly.

companies:
  - id: goldman_sachs
    name: "Goldman Sachs"
    # Location filter, matching Goldman's own LOCATION filter hierarchy
    # (country -> state -> city). Omit `state`/`city` to match every
    # state/city within the level above. Empty `locations` list means
    # worldwide. Add more entries to watch more places at once.
    locations:
      - country: "United States"
        state: "TX"
        city: "Dallas"
    # A role notifies if any of these (case-insensitive) appear in its
    # title or division. Empty list means every posting notifies,
    # regardless of keyword, e.g. "Quantitative Strats", "Engineering
    # Division", "Software Engineer".
    keywords: []

  - id: two_sigma
    name: "Two Sigma"
    locations:
      - country: "United States"
    keywords: []

  - id: de_shaw
    name: "D. E. Shaw"
    locations:
      - country: "United States"
    keywords: []

  - id: hudson_river_trading
    name: "Hudson River Trading"
    locations:
      - country: "United States"
    keywords: []

  - id: capital_one
    name: "Capital One"
    # Capital One searches within a radius of a geocoded point rather than
    # an exact city match, and Dallas vs. Plano turned out to return very
    # different result sets despite being ~20 miles apart - so both are
    # listed explicitly (deduped automatically) rather than relying on one
    # covering the other.
    locations:
      - country: "United States"
        state: "TX"
        city: "Dallas"
      - country: "United States"
        state: "TX"
        city: "Plano"
    keywords: []
